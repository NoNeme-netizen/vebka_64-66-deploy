# Репетиция деплоя «Манчкин-пикер»: приложение + nginx как единая точка входа.
# Репозиторий деплоя не собирает приложение из исходников: готовый образ
# публикует CI проекта-приложения (https://github.com/NoNeme-netizen/vebka_64-66)
# в GitHub Container Registry, отсюда он скачивается при запуске.
# Запуск из этой папки:  docker compose up -d
# Остановка:             docker compose down

services:
  # веб-приложение (React Router, серверный рендеринг).
  # Порт 3000 НАРУЖУ не публикуется: снаружи проект доступен только через nginx
  app:
    image: ghcr.io/noneme-netizen/vebka_64-66:latest
    environment:
      - PORT=3000
      # секрет сессии и ключи облачной базы передаются переменными
      # окружения (значения — в файле .env рядом с этим compose-файлом)
      - SESSION_SECRET=${SESSION_SECRET:-munchkin-picker-2026}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
    restart: unless-stopped

  # веб-сервер: HTTPS-сертификат, домен munchkin-picker.localhost,
  # обратный прокси на приложение
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    restart: unless-stopped
